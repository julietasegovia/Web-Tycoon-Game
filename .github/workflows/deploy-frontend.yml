# .github/workflows/deploy-frontend.yml
name: Desplegar Frontend

# El robot se activará cuando haya un 'push' en la rama 'main'
on:
  push:
    branches: [ "main" ]

# Los trabajos son las tareas que el robot va a ejecutar
jobs:
  # Este trabajo se llama 'deploy'
  deploy:
    # El robot usará una máquina virtual de Ubuntu para trabajar
    runs-on: ubuntu-latest

    # Pasos a seguir:
    steps:
      # 1. Clonar el código de tu repositorio dentro del robot
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Instalar la versión correcta de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Usa la versión LTS de Node.js

      # 3. Instalar las dependencias del proyecto
      # Si tu frontend está en una sub-carpeta, navega a ella primero
      - name: Instalar dependencias
        run: |
          cd frontend       # Cambia 'frontend' por la ruta a tu app
          npm ci            # 'ci' es para instalaciones limpias en robots

      # 4. ¡El PASO CLAVE! Compilar el proyecto
      - name: Compilar la app
        run: |
          cd frontend       #  Cambia 'frontend' por la ruta a tu app
          npm run build     # Esto crea la carpeta 'dist'

      # 5. Subir el artefacto (la carpeta 'dist') para usarlo después
      - name: Subir artefacto de la compilación
        uses: actions/upload-artifact@v4
        with:
          name: app-compilada   # El nombre del paquete
          path: frontend/dist   # Ruta a la carpeta 'dist' generada

# ... (dentro del mismo 'job deploy', después del paso 'upload-artifact')

      # 6. Descargar el artefacto que acabamos de subir
      - name: Descargar artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: app-compilada
          path: build-temp  # Lo guardamos temporalmente

      # 7. Enviar los archivos al servidor (copia y pega)
      - name: Copiar archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build-temp/"    #  Lo que está en el robot...
          target: "/var/www/html/" # ...se copia a esta carpeta en el servidor

      - name: Reiniciar servidor web
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart nginx  # Común para servidores web Linux
            echo "Despliegue completado"

